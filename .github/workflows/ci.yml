name: CI

on:
  push:
    branches: [ dev-scaffold ]
  pull_request:
    branches: [ dev-scaffold ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest httpx pytest-asyncio
      - name: Lint
        run: |
          python -m black --check .
          python -m flake8 .
      - name: Run tests
        run: |
          python -m pytest -q
